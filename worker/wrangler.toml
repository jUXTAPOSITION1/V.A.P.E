# Cloudflare Workers deploy target — worker/deno/ runs the same app.fetch()
# handler on Deno Deploy as a documented fallback (see worker/README.md's
# "Cloudflare + Deno Deploy" section) in case this account ever hits the
# workers.dev subdomain-registration issue again. `workers_dev = true` makes
# the intent explicit to Wrangler rather than relying on interactive prompts
# it can't ask in CI — the actual one-time subdomain claim still has to
# happen in the Cloudflare dashboard first (Workers & Pages → Overview).
name = "vape-x402"
main = "src/index.ts"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ── Payment configuration ────────────────────────────────────────────────
# Base mainnet. VAPOR (our own facilitator) is preferred; CDP's hosted
# facilitator is the fallback for any verify/settle/getSupported call VAPOR
# errors on (see src/lib/facilitatorClient.ts) — a VAPOR outage must never
# take real revenue down with it. The full pay -> verify -> settle loop was
# proven first against Base Sepolia + the public facilitator.x402.org
# testnet facilitator before ever switching to real funds; see git history
# on this file for the testnet values.
[vars]
PAY_TO_ADDRESS = "0xa1420293a7df49bc8380f543a1fe7b8d6f582879"
X402_NETWORK = "eip155:8453"
X402_FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"
VAPOR_FACILITATOR_URL = "https://x402.duckdns.org"

# The following are SECRETS, not vars — set them with:
#   wrangler secret put ETHERSCAN_API_KEY
#   wrangler secret put CDP_API_KEY_ID
#   wrangler secret put CDP_API_KEY_SECRET
#   wrangler secret put ALCHEMY_API_KEY
#   wrangler secret put COINGECKO_API_KEY
#   wrangler secret put CODEX_API_KEY
#   wrangler secret put TAVILY_API_KEY
#   wrangler secret put BRAVE_API_KEY
#   wrangler secret put FIRECRAWL_API_KEY
#   wrangler secret put OCI_GENAI_API_KEY
#   wrangler secret put OCI_COMPARTMENT_OCID
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put GROQ_API_KEY
#
# ETHERSCAN_API_KEY: only exploit_check / dossier_check need it; the other
# 4 offerings work without it (degrade to {"verified": null}, matching
# agents/data_fetchers.py).
#
# TAVILY_API_KEY / BRAVE_API_KEY / FIRECRAWL_API_KEY: dossier_check's web-
# reputation search + declared-social scrape (src/lib/webResearch.ts) —
# each optional, tried in order, degrading to "unavailable" if none are set.
#
# OCI_GENAI_API_KEY / OCI_COMPARTMENT_OCID / GEMINI_API_KEY / GROQ_API_KEY:
# src/lib/llm.ts::askFrontier()'s frontier-LLM chain, backing dossier_check's
# AI quick review and website_review's red-flag read. OCI_GENAI_API_KEY (a
# plain Bearer secret from OCI's Generative AI service, matching
# agents/llm.py::ask_oci_grok()) is the real primary route — GEMINI_API_KEY/
# GROQ_API_KEY are only the fallback if it's unset or errors.
# OCI_COMPARTMENT_OCID is optional (only some OCI tenancy configs require
# the CompartmentId header). Without any of these four, both offerings
# still settle payment correctly but return an honest "AI review
# unavailable this cycle" instead of a real read.
#
# CDP_API_KEY_ID / CDP_API_KEY_SECRET: a CDP Secret API Key (portal.cdp.
# coinbase.com) used to mint the Bearer JWT src/lib/cdpAuth.ts signs for
# every /verify, /settle, and /supported call to the facilitator above. Both
# must be set for real settlement to work — src/index.ts's
# buildCreateAuthHeaders() no-ops (no auth headers sent) if either is
# missing, which the facilitator will reject with 401.
#
# ALCHEMY_API_KEY: a free-tier Alchemy app key scoped to Base Mainnet
# (dashboard.alchemy.com), used by the free /portfolio, /nfts,
# /network-status, and /cost-basis routes (src/lib/alchemy.ts), and by the
# priced /data/wallet_pnl_deepdive offering (dataHandlers.ts) — rebuilt onto
# Alchemy after Codex's wallet-analytics fields turned out to be gated
# behind a paid Codex plan ("Not authorized: please upgrade your plan").
# Without it those routes return 503/error and the free ones fall back to
# their direct public-RPC path.
#
# COINGECKO_API_KEY: a free CoinGecko Demo API key (coingecko.com/en/api —
# no payment required, just a signup), used by /prices (better rate-limit
# headroom than the fully anonymous public API), /cost-basis, and
# /data/wallet_pnl_deepdive (needs CoinGecko's historical-price-by-contract
# endpoint, which requires this key — that endpoint 403s without one).
# Without it those routes return 503/error.
#
# CODEX_API_KEY: a Codex.io GraphQL API key (dashboard.codex.io — free tier),
# used by the free /virtuals-snapshot, /trending-base, and /new-launches
# routes (src/lib/codex.ts) — token-market-data queries only (filterTokens/
# holders/getBars), which Codex's free tier does serve. NOT used by
# /data/wallet_pnl_deepdive — that offering was rebuilt onto Alchemy +
# CoinGecko after Codex rejected its wallet-analytics fields
# (balances/detailedWalletStats/walletChart) with "Not authorized: please
# upgrade your plan", a paid-plan gate, not a bug. Codex requires a bearer
# key that can't ship to the browser, unlike the keyless DefiLlama/CoinGecko
# calls the site makes directly elsewhere — so this is a real, separate
# secret, not optional polish. Without it those three routes return 503 and
# the corresponding site panels show as unavailable.
#
# GH_DISPATCH_TOKEN: a fine-grained GitHub PAT scoped to jUXTAPOSITION1/V.A.P.E
# with "Actions: write" + "Contents: read", used only by /scan/bounty_deep_dive
# (the $50/24h-SLA premium offering) to trigger .github/workflows/deep-dive-
# bounty.yml — see src/lib/githubDispatch.ts. Workers have no equivalent of the
# GITHUB_TOKEN Actions injects into its own runs, so this is a real, separate
# secret. Without it, the route still gates payment correctly but returns a
# 503 after settlement telling the buyer to use ACP instead — set this before
# advertising the x402 path for this offering.
#
# ── VAPE_JOBS (KV binding, not a secret) ────────────────────────────────
# The live x402 job ledger (src/lib/jobLog.ts, /x402/feed + /x402/stats) is
# backed by a Cloudflare KV namespace, which — unlike the secrets above —
# has to be declared as a `[[kv_namespaces]]` binding in THIS file with a
# real namespace id, not just set via `wrangler secret put`. Deliberately
# NOT committed here as a static block: a bogus/placeholder id would fail
# `wrangler deploy` outright and take down every other route with it, so
# .github/workflows/deploy-worker.yml injects this binding at deploy time
# from a `VAPE_JOBS_KV_ID` repo secret instead, exactly like
# CLOUDFLARE_API_TOKEN — only appending it when that secret is set. Until
# then, /scan/* keeps working exactly as before; /x402/feed and /x402/stats
# just 503 with "job feed not configured". One-time setup:
#   1. npx wrangler kv namespace create VAPE_JOBS   (run once, needs CLOUDFLARE_API_TOKEN/ACCOUNT_ID)
#   2. copy the returned id into a new repo secret named VAPE_JOBS_KV_ID
#   3. re-run (or wait for) the next deploy-worker.yml run
