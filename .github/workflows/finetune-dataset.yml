name: Build Fine-Tune Dataset (VAPE investigation corpus)

# Regenerates the fine-tune corpus (scripts/build_finetune_dataset.py) from
# intel/investigations/, intel/reports/, and skillforge/memory/lessons.jsonl
# so it compounds automatically as VAPE keeps operating, instead of staying a
# frozen one-off snapshot. Stdlib-only, no external API keys — the script
# just reads already-committed reports/lessons and derives labels from each
# script's own deterministic scoring function, so this is a pure
# regeneration, never a source of new judgment. Weekly is plenty — none of
# these sources accumulate fast enough to need more (see archive-reports.yml
# for the same "slow-moving hygiene" cadence).
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC (after archive-reports' 05:30 pass)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finetune-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build fine-tune dataset
        run: python scripts/build_finetune_dataset.py

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/finetune/
          git commit -m "finetune dataset rebuild $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
