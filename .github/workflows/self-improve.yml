name: VAPE Self-Improvement (grounded, opens a PR for review)

on:
  schedule:
    - cron: '0 12 * * *'   # once daily — heavier than the hourly crons (LLM call + PR)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  self-improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Install
        run: |
          pip install -r agents/requirements.txt
          pip install pyflakes
      - name: Run self-improvement cycle (finds a real gap, proposes a fix, opens a PR)
        run: python agents/self_improve.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ skillforge/memory/ || true
          git commit -m "VAPE self-improvement cycle $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            if git push; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push after 5 retries -- changes were NOT committed"
            exit 1
          fi
