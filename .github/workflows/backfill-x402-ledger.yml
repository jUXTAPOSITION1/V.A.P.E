name: Backfill x402 Ledger (manual, one-off reconstruction)

# Reconstructs pre-ledger paid x402 jobs from real on-chain USDC transfer
# history — see agents/x402_ledger_backfill.py's docstring. Manual-only,
# never scheduled: this is a maintenance operation, not a recurring job.
# Safe to re-run (dedupes by transaction hash).

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days of Base blocks to scan for USDC transfers'
        required: false
        default: '30'
      reset:
        description: 'Drop and reclassify all previously-backfilled records from scratch (true/false) — use after fixing the amount-matching logic'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.VAPE_JOBS_KV_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Backfill from real on-chain history
        if: ${{ env.HAS_SECRETS == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPE_JOBS_KV_ID: ${{ secrets.VAPE_JOBS_KV_ID }}
          X402_BACKFILL_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
          X402_BACKFILL_RESET: ${{ github.event.inputs.reset || 'false' }}
        run: python -m agents.x402_ledger_backfill

      - name: Missing required secrets
        if: ${{ env.HAS_SECRETS == 'false' }}
        run: |
          echo "::error::Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and VAPE_JOBS_KV_ID repo secrets — see agents/x402_ledger_backfill.py."
          exit 1
