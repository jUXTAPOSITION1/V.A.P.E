name: Backfill x402 Ledger (manual, one-off reconstruction)

# Reconstructs pre-ledger paid x402 jobs from real on-chain USDC transfer
# history — see agents/x402_ledger_backfill.py's docstring. Manual-only,
# never scheduled: this is a maintenance operation, not a recurring job.
# Safe to re-run (dedupes by transaction hash).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.VAPE_JOBS_KV_ID != '' && secrets.ETHERSCAN_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backfill from real on-chain history
        if: ${{ env.HAS_SECRETS == 'true' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPE_JOBS_KV_ID: ${{ secrets.VAPE_JOBS_KV_ID }}
        run: python -m agents.x402_ledger_backfill

      - name: Missing required secrets
        if: ${{ env.HAS_SECRETS == 'false' }}
        run: |
          echo "::error::Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VAPE_JOBS_KV_ID, and ETHERSCAN_API_KEY repo secrets — see agents/x402_ledger_backfill.py."
          exit 1
