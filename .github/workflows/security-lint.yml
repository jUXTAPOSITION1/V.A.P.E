name: Security Lint (CI workflow regression guard)

# Encodes the exact CI supply-chain/injection risk classes found in the
# 2026-07-13 repo-wide security audit (see docs/SECURITY_PROTOCOL.md) as a
# deterministic, network-free check against every workflow file — so a
# future PR to .github/workflows/ (including one self_improve.py or
# skillforge_build.py opens on its own) can't silently reintroduce any of
# them. See scripts/security_lint.py for what's actually checked.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/security_lint.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/security_lint.py"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install -q pyyaml
      - name: Run security_lint
        run: python3 scripts/security_lint.py

  # General-purpose complement to the `lint` job above: security_lint.py only
  # checks the specific classes the 2026-07-13 audit actually found (its own
  # docstring names re-interpolated `steps.*.outputs.*` as a deliberate blind
  # spot, for one). zizmor is a maintained, general GitHub Actions static
  # analyzer that catches a much broader set of template-injection,
  # credential-persistence, and excessive-permission patterns — this job
  # exists so those classes get checked too, not just the ones already known.
  # Pinned action + tool version (real, verified against
  # github.com/zizmorcore/zizmor-action and PyPI at the time this was added)
  # rather than floating on `latest`, matching this repo's existing pinning
  # convention for third-party Actions with elevated permissions.
  #
  # v0.5.7 (192e21d) predated zizmor 1.27.0 and didn't recognize it as a
  # valid --version, failing every run with "Unknown version: 1.27.0" the
  # moment PyPI's zizmor package crossed that version — v0.6.0 was released
  # (2026-07-15) specifically to add 1.27.0 support (now its own default).
  # Re-verify both the action's tag->commit mapping and zizmor's own PyPI
  # version list before bumping either pin again.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          version: "1.27.0"
          persona: pedantic
          min-severity: medium
