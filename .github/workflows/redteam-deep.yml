name: VAPE AI Red-Team Deep Scan (garak + promptfoo + deepteam, daily)

# Heavier than redteam.yml's custom test: garak pulls torch/transformers
# (multi-minute first install per skillforge/skills/ai-agent-redteam.md's own
# "Known limitations") and promptfoo needs a full npm install. Both are
# pip/npm-cached below so daily runs reuse yesterday's download instead of
# re-pulling torch from scratch every time.
on:
  schedule:
    - cron: '0 13 * * *'   # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redteam-deep
  cancel-in-progress: false

jobs:
  redteam-deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache npm global installs (promptfoo has no package.json/lock for setup-node's own cache to key on)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-global-promptfoo-${{ runner.os }}
      - name: deepteam campaign (VAPE's real report pipeline, VAPE-model simulator+judge)
        run: skillforge/tools/ai-redteam/deepteam.sh skillforge/tools/ai-redteam/campaign_vape.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        continue-on-error: true
      - name: garak scan (real production model, native groq generator)
        run: python skillforge/tools/ai-redteam/run_garak_scan.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true
      - name: promptfoo scan (real system prompt, native groq provider)
        run: python skillforge/tools/ai-redteam/run_promptfoo_scan.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true
      - name: Commit reports + findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ skillforge/memory/findings.jsonl || true
          git commit -m "VAPE AI red-team deep scan $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            if git push; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push after 5 retries -- changes were NOT committed"
            exit 1
          fi
