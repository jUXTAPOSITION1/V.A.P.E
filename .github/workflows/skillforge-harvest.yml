name: SKILLFORGE Harvest (hourly, pulls new CVEs + security-tool releases)

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17 to avoid GH cron congestion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillforge-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:                              # ← ADDED: job-level env for all MCP/research keys
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Harvest real intel (CVEs + tool releases)
        run: python skillforge/harvest.py
      - name: Commit findings (direct, data only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillforge/memory/
          git commit -m "skillforge harvest $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no new intel"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
