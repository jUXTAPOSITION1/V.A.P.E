name: SKILLFORGE Self-Directed Build (2x/day, opens a PR for review)

# 2x/day — VAPE proposing its OWN work (not fixing a known bug like
# self-improve.yml). Each real proposal is grounded in tool-registry gaps +
# Memory findings/lessons and explicitly returns nothing when the real
# signal doesn't justify a build, so most cycles are a no-op report rather
# than a PR — this cadence just means checking more often, not forcing two
# PRs a day.
on:
  schedule:
    - cron: '0 9,21 * * *'   # 09:00 and 21:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skillforge-build
  cancel-in-progress: false

jobs:
  skillforge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Propose + build a self-directed skill/tool, open a PR
        run: python -m agents.skillforge_build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit report
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ skillforge/memory/ || true
          git commit -m "VAPE skillforge build cycle $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
