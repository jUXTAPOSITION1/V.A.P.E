name: 402 Index Domain Claim (manual, one-off)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'claim (get token+hash) / verify (after the hash is deployed) / status (read-only GET of a service-detail URL)'
        required: true
        type: choice
        options: [claim, verify, status]
        default: claim
      service_url:
        description: 'Service-detail URL to fetch — required only for the status action (e.g. https://402index.io/service/<uuid>)'
        required: false
        default: ''

permissions:
  contents: read

# Shares the same 402index.io per-domain claim state as x402-directory.yml's
# PATCH-based edit path (agents/x402_directory_register.py) -- both worth
# serializing against each other, not just against themselves.
concurrency:
  group: x402-directory-registration
  cancel-in-progress: false

jobs:
  claim-or-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run 402 Index ${{ inputs.action }}
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_SERVICE_URL: ${{ inputs.service_url }}
        run: |
          if [ "$INPUT_ACTION" = "status" ]; then
            python agents/x402_index_claim.py status --url "$INPUT_SERVICE_URL"
          else
            python agents/x402_index_claim.py "$INPUT_ACTION"
          fi
