name: Site Version Currency (checks/bumps pinned CDN versions in docs/)

# Dependabot (.github/dependabot.yml) already keeps every real package
# manager (npm root + worker/, pip root + agents/, github-actions, and
# VAPOR's own dependabot.yml) current on its own weekly cadence. This
# workflow closes the one gap Dependabot structurally can't see: exact
# version strings hardcoded into CDN URLs inside docs/ (GitHub Pages) —
# jsPDF, Font Awesome, and the @x402/* client SDK used by hire.js. See
# scripts/check_site_versions.py for the actual check/bump logic.

on:
  schedule:
    - cron: '0 8 * * 1'   # weekly, Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: version-currency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check pinned CDN versions in docs/
        run: python3 scripts/check_site_versions.py

      - name: Ensure version-review label exists
        run: gh label create version-review --description "Needs a human to check CDN-pinned package call-site compatibility before bumping" --color "fbca04" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR for same-major bumps
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/; then
            echo "no same-major bumps to propose"; exit 0
          fi
          BRANCH="version-currency/site-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add docs/
          git commit -m "site version currency $(date -u +%F): bump pinned CDN packages (same major)"
          # persist-credentials: false on checkout means push has no credential
          # unless re-injected here, scoped to just this step.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$BRANCH"
          if gh pr create --title "Site CDN version bump $(date -u +%F)" \
            --body "Auto-bumped by version-currency.yml: same-major-version updates to CDN-pinned packages in docs/ (Dependabot can't see these — they're plain version strings in HTML/JS, not a package manifest). Review before merge." \
            --label "dependencies" --base main --head "$BRANCH"; then
            for old in $(gh pr list --state open --label dependencies --json number,headRefName \
                --jq ".[] | select(.headRefName != \"$BRANCH\" and (.headRefName | startswith(\"version-currency/site-\"))) | .number"); do
              gh pr close "$old" --comment "Superseded by a newer version-currency PR." || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open/update tracking issue for major-version items
        run: |
          if [ ! -f version-review-needed.json ]; then
            # Nothing pending review — close out any stale tracking issue.
            for old in $(gh issue list --state open --label version-review --json number --jq '.[].number'); do
              gh issue close "$old" --comment "No CDN packages currently need manual major-version review." || true
            done
            exit 0
          fi
          BODY=$(python3 -c "
          import json
          items = json.load(open('version-review-needed.json'))
          lines = ['Packages pinned in docs/ that need a human to check call-site compatibility before bumping (major-version jump, or the checker script itself is out of date):', '']
          for e in items:
              old, latest = e.get('old', '?'), e.get('latest', '?')
              lines.append(f\"- \`{e['file']}\`: **{e['package']}** {old} -> {latest} ({e['reason']})\")
          lines.append('')
          lines.append('Generated by scripts/check_site_versions.py via version-currency.yml.')
          print(chr(10).join(lines))
          ")
          EXISTING=$(gh issue list --state open --label version-review --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Site CDN packages needing manual version review" \
              --body "$BODY" --label "version-review,dependencies"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
