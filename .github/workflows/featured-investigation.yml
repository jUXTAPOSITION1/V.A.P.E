name: VAPE Featured Investigation (auto-target deep dive)

# Split out of bounty-cycle.yml (which stays hourly for the bounty-hunt +
# self-review passes) so the site's "Featured Investigation" spotlight and
# DATA AGENT (both facilitator-pinned instances recruited inside
# agents/investigate.py for every real investigation — see
# agents/data_agent.py and agents/data_agent_vapor.py) get a much fresher
# cadence without bumping the cost/frequency of the rest of the hourly cycle.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: featured-investigation
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write  # for the WIF auth step below (agents/llm.py::ask_vertex_candidate())
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      # DATA AGENT's own funded wallet, shared by both facilitator-pinned
      # instances (agents/data_agent.py -> CDP, agents/data_agent_vapor.py ->
      # VAPOR) — recruited mid-investigation to each independently hire 1 of
      # VAPE's own $0.01 x402 data offerings; each instance's own 30m-interval
      # gate + 48/day cap apply regardless of how often this workflow fires.
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (web-reputation search spawns Tavily/Firecrawl/Bright Data MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: pip install -r agents/requirements.txt
      - id: vertex-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: Deep Investigation (auto target)
        # VAPE_VERTEX_ACCESS_TOKEN (from the WIF auth step above) lets
        # _expert_assessment() try VAPE's own Vertex-tuned model first — see
        # agents/llm.py::ask_vertex_candidate_safe(); falls back to the
        # normal frontier chain unchanged if that call ever errors.
        env:
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
        run: python agents/investigate.py --auto || echo "no auto target this cycle"
      # Manual-trigger convenience: force both DATA AGENT instances against a
      # known Base address, bypassing investigate.py's auto-target selection
      # (which may land on a non-Base target, or none at all, this cycle) —
      # useful for spot-checking the CDP/VAPOR split without waiting on
      # chance. Each instance still enforces its own 30m-interval gate.
      - name: Force both DATA AGENT instances (manual trigger only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from agents import data_agent, data_agent_vapor
          print('cdp:', data_agent.run_for_investigation('0xa1420293a7df49bc8380f543a1fe7b8d6f582879', '8453'))
          print('vapor:', data_agent_vapor.run_for_investigation('0xa1420293a7df49bc8380f543a1fe7b8d6f582879', '8453'))
          "
      - name: Build Intel Index (site data)
        run: python agents/build_intel_index.py
      - name: Rebuild Memory SQLite index (queryable recall; derived, not committed)
        run: python -m skillforge.memory.index_db build || echo "memory index skipped"
      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/investigations/ intel/catalog/ skillforge/memory/ data/intel-index.json
          git commit -m "Featured investigation $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
