name: VAPE Featured Investigation (auto-target deep dive)

# Split out of bounty-cycle.yml (which stays hourly for the bounty-hunt +
# self-review passes) so the site's "Featured Investigation" spotlight and
# DATA AGENT (both facilitator-pinned instances recruited inside
# agents/investigate.py for every real investigation — see
# agents/data_agent.py and agents/data_agent_vapor.py) get a much fresher
# cadence without bumping the cost/frequency of the rest of the hourly cycle.
on:
  schedule:
    # Real, confirmed severity (live run history checked again after the 4x/hr
    # bump landed): even at 4 scheduled opportunities/hour this workflow still
    # only actually fired ONCE in a 1h43m window — roughly 1 real fire per
    # 7 intended ones. The job itself completes in well under a minute (no
    # concurrency/overlap issue), so this is GitHub's own `schedule` event
    # simply not delivering on public repos under platform load, at a rate
    # far worse than a "drop some fraction" model — tightening the cron
    # further would not meaningfully help. This cron is now only a low-
    # reliability SAFETY NET that can (re)start the self-dispatch chain
    # below if it ever stops; the real cadence comes from the "Schedule
    # next cycle" step at the end of this job, which is not subject to
    # `schedule`'s own unreliability at all (it's an explicit API call).
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      chained:
        description: 'internal: set by the self-dispatch chain step, never by a human — distinguishes a chain continuation from a real manual test dispatch'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: featured-investigation
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    # Bumped from 20: the self-dispatch chain's own ~14min sleep (see the
    # last step) needs headroom on top of the real work above it.
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write  # for the WIF auth step below (agents/llm.py::ask_vertex_candidate())
      actions: write  # to dispatch the next cycle of this same workflow (see last step)
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      # DATA AGENT's own funded wallet, shared by both facilitator-pinned
      # instances (agents/data_agent.py -> CDP, agents/data_agent_vapor.py ->
      # VAPOR) — recruited mid-investigation to each independently hire 1 of
      # VAPE's own $0.01 x402 data offerings. VAPOR still enforces its own
      # fixed 30m-interval/48-per-day cap regardless of how often this
      # workflow fires; the CDP-pinned instance instead paces itself toward
      # a growing daily MINIMUM that compounds 1% higher every day, forever
      # (agents/data_agent.py's module docstring) — how often THIS workflow's
      # own cron actually fires is the real ceiling on how fast that growth
      # can be delivered, since no in-process limiter can invent extra runs.
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (web-reputation search spawns Tavily/Firecrawl/Bright Data MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: pip install -r agents/requirements.txt
      - id: vertex-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: Deep Investigation (auto target)
        # _expert_assessment() tries OCI-hosted Grok 4.3 first (agents/
        # llm.py::ask_oci_grok_safe()), falling back to VAPE's Vertex-tuned
        # model (VAPE_VERTEX_ACCESS_TOKEN, from the WIF auth step above),
        # falling back further to the normal frontier chain unchanged if
        # both error/aren't configured.
        env:
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
        run: python agents/investigate.py --auto || echo "no auto target this cycle"
      # Unconditional — runs every cycle regardless of whether the step above
      # found an auto-investigation target this time. Real production bug
      # this fixes: DATA AGENT previously only ever got a hire opportunity
      # from *inside* a successful auto-investigation (agents/investigate.py
      # ::_data_agent_intel()), so a run of cycles where auto_target() came
      # up empty meant hours with zero real x402 transactions — confirmed
      # directly against live GitHub Actions logs. run_standalone() sources
      # its own fresh Base candidate instead of needing one handed to it, so
      # this stream fires on its own fixed cadence either way. VAPOR still
      # gates itself against a fixed 30m-interval/daily-cap; the CDP-pinned
      # main + catalog streams instead self-pace toward their own growing
      # daily minimum (agents/data_agent.py) — this step can run every cycle
      # with no risk of over-hiring, since each stream's own gate decides
      # whether it's actually due.
      - name: DATA AGENT standalone cycle + catalog sweep (unconditional cadence)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from agents import data_agent, data_agent_vapor
          print('cdp standalone:', data_agent.run_standalone())
          print('vapor standalone:', data_agent_vapor.run_standalone())
          print('cdp catalog sweep:', data_agent.run_catalog_sweep())
          "
      # Manual-trigger convenience: force both DATA AGENT instances against a
      # known Base address, bypassing investigate.py's auto-target selection
      # (which may land on a non-Base target, or none at all, this cycle) —
      # useful for spot-checking the CDP/VAPOR split without waiting on
      # chance. VAPOR still enforces a fixed 30m-interval gate; CDP's own
      # gate is now the adaptive, growth-target one described above.
      # Real bug this guards against: the self-dispatch chain step below
      # ALSO fires via workflow_dispatch, so a bare `event_name ==
      # 'workflow_dispatch'` check would run this forced hire every ~15min
      # forever instead of only on a genuine human-triggered test — the
      # `chained` input (set only by that chain step) tells them apart.
      - name: Force both DATA AGENT instances (manual trigger only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chained != 'true' }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from agents import data_agent, data_agent_vapor
          print('cdp:', data_agent.run_for_investigation('0xa1420293a7df49bc8380f543a1fe7b8d6f582879', '8453'))
          print('vapor:', data_agent_vapor.run_for_investigation('0xa1420293a7df49bc8380f543a1fe7b8d6f582879', '8453'))
          "
      - name: Build Intel Index (site data)
        run: python agents/build_intel_index.py
      - name: Rebuild Memory SQLite index (queryable recall; derived, not committed)
        run: python -m skillforge.memory.index_db build || echo "memory index skipped"
      # Bounty Command Center's live-task feed — real recent automated
      # commits + one OCI-Grok-authored synthesis line (agents/task_feed.py).
      # Runs on this workflow's own fast cadence so the site's "tasks" stat
      # never sits stale; a failure here must never block the real
      # investigation work already committed above, so it's non-fatal.
      - name: Task feed (Bounty Command Center)
        env:
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
        run: python agents/task_feed.py || echo "task feed skipped"
      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/investigations/ intel/catalog/ skillforge/memory/ data/intel-index.json
          [ -f data/task-feed.json ] && git add data/task-feed.json || true
          # Only exists once the catalog sweep's first address-based hire ever
          # succeeds — `git add` on a not-yet-created path would abort this
          # step outright (GitHub Actions runs `run:` blocks with `set -e`),
          # so this is guarded separately from the always-present paths above.
          [ -f data/token_database.jsonl ] && git add data/token_database.jsonl || true
          git commit -m "Featured investigation $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            if git push; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push after 5 retries -- changes were NOT committed"
            exit 1
          fi
      # Real cadence mechanism (see the `on.schedule` comment above for why):
      # GitHub's own `schedule` trigger drops the vast majority of this
      # workflow's intended firings, independent of cron frequency — the fix
      # is to stop depending on it. This step self-dispatches the NEXT cycle
      # via the Actions API instead, which isn't subject to `schedule`'s
      # unreliability at all. `if: always()` so a failure anywhere above
      # (a bad investigation target, a flaky commit, etc.) never breaks the
      # chain — keeping the heartbeat alive matters more than any single
      # cycle's own success. Sleeps out the rest of the ~15min interval
      # first (real work above takes well under a minute) so cadence stays
      # close to 15min rather than back-to-back-firing continuously.
      - name: Schedule next cycle in ~15 minutes (self-dispatch chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 850
          curl -sS -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/featured-investigation.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chained":"true"}}'
