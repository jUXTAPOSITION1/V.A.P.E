name: VAPE Featured Investigation (auto-target deep dive)

# Split out of bounty-cycle.yml (which stays hourly for the bounty-hunt +
# self-review passes) so the site's "Featured Investigation" spotlight and
# DATA AGENT (recruited inside agents/investigate.py for every real
# investigation — see agents/data_agent.py) get a much fresher cadence
# without bumping the cost/frequency of the rest of the hourly cycle.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-investigation
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      # DATA AGENT's own funded wallet — recruited mid-investigation to hire
      # 2-4 of VAPE's own $0.01 x402 data offerings (see agents/data_agent.py;
      # its own internal 2h-interval gate + 15/day cap apply regardless of
      # how often this workflow fires).
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (web-reputation search spawns Tavily/Firecrawl/Bright Data MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: pip install -r agents/requirements.txt
      - name: Deep Investigation (auto target)
        run: python agents/investigate.py --auto || echo "no auto target this cycle"
      # Temporary diagnostic (2026-07-18, manual trigger only): macro_sweep.py
      # reports have shown "no web search results available" repeatedly.
      # Print exactly which provider is active and what a real search call
      # actually returns, so this isn't guesswork. Remove once root-caused.
      - name: Diagnose web search availability (manual trigger only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python -m skillforge.research providers
          echo "--- real search call ---"
          python -m skillforge.research search "Federal Reserve interest rate crypto regulation news this week" --max 8
      - name: Build Intel Index (site data)
        run: python agents/build_intel_index.py
      - name: Rebuild Memory SQLite index (queryable recall; derived, not committed)
        run: python -m skillforge.memory.index_db build || echo "memory index skipped"
      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/investigations/ intel/catalog/ skillforge/memory/ data/intel-index.json
          git commit -m "Featured investigation $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
