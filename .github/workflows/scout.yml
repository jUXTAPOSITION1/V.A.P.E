name: SCOUT Bounty Radar (hourly, rule-based + strategic briefing)

on:
  schedule:
    - cron: '37 * * * *'   # every hour at :37 — offset from reputation (:17) and bounty-cycle (:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      # scout.py's strategic briefing runs every cycle now (agents/llm.py is
      # stdlib-only — no pip install needed for these). _act_on_incidents()
      # additionally calls agents.investigate.investigate() for real when an
      # incident's address verifies, on any chain investigate.py supports —
      # which needs the full set below, same secrets intel-sweeps.yml wires
      # for the same reason.
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (agents.investigate's web reputation check spawns research MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: pip install -r agents/requirements.txt
      - name: Run SCOUT (rule-based scan + strategic briefing + real incident forensics)
        run: python agents/scout.py
      - name: Update engagement status (real record of what VAPE did about each tracked lead)
        continue-on-error: true
        run: python -m agents.engagements
      - name: Run Bounty Ops (Task #197 — classify + Grok-4.3 checklist for VAPE-fit live programs)
        continue-on-error: true
        run: python -m agents.bounty_ops
      - name: Commit bounty radar sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # intel/investigations/ + intel/catalog/ + skillforge/memory/:
          # _act_on_incidents() may trigger a real agents.investigate.py
          # forensics pass — those land here just like any other investigation.
          # intel/engagements/: agents.engagements.py's real, idempotent status update.
          # intel/bounty-radar/bounty-ops/: agents.bounty_ops.py's real,
          # checklist-tracked Bounty Ops records (Task #197).
          git add intel/bounty-radar/ intel/investigations/ intel/catalog/ intel/engagements/ skillforge/memory/
          git commit -m "SCOUT bounty radar sweep $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
