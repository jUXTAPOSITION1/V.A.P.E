name: SCOUT Bounty Radar (hourly, rule-based + gated Grok briefing)

on:
  schedule:
    - cron: '37 * * * *'   # every hour at :37 — offset from reputation (:17) and bounty-cycle (:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      # agents/llm.py is stdlib-only (urllib) — no pip install needed. These
      # are only ever read on a cycle with genuinely new opportunities (see
      # scout.py::_grok_briefing), so most hourly runs never touch them.
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      XAI_API_KEY_2: ${{ secrets.XAI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run SCOUT (rule-based scan; Grok briefing only on genuinely new opportunities)
        run: python agents/scout.py
      - name: Commit bounty radar sweep
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/bounty-radar/
          git commit -m "SCOUT bounty radar sweep $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
