name: Tests (deterministic core + pyflakes)

# Two cheap, hermetic gates on every push/PR that touches Python:
#   1. pytest over tests/ — pins the network-free decision logic (score(),
#      threat-level, the attack-pattern classifier, the archiver round-trip,
#      the safe fmt helpers). These are the pieces whose correctness a reader,
#      or VAPE's own self-improvement loop, has to trust before believing a
#      verdict — and the first thing a self-proposed refactor could regress.
#   2. pyflakes over agents/ + scripts/ + training/ — real undefined-name/unused-import
#      bugs, the same check self_improve.py already runs reactively, promoted
#      to a pre-merge gate so a broken import can't land on main.
# No secrets, no API keys, no external calls — runs in seconds.
on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "scripts/**"
      - "training/**"
      - "skillforge/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "agents/**"
      - "scripts/**"
      - "training/**"
      - "skillforge/**"
      - "tests/**"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test + runtime deps
        run: |
          # pyyaml: not a runtime dep of agents/, but scripts/security_lint.py
          # (and its tests/test_security_lint.py) parse workflow YAML — needs
          # to be installed unconditionally here, not folded into the
          # best-effort agents/requirements.txt install below.
          pip install pytest pyflakes pyyaml
          # Runtime deps are best-effort: the deterministic tests are hermetic
          # and import only stdlib + repo code, so a runtime-dep install failure
          # must not false-green the gate — but it also shouldn't be silent.
          # Warn loudly (visible in the run + step summary) and carry on.
          if ! pip install -r agents/requirements.txt; then
            echo "::warning::agents/requirements.txt install failed — continuing (deterministic tests don't need it, but investigate if imports break)"
          fi
      - name: pyflakes (agents/ + scripts/ + training/)
        run: python -m pyflakes agents/ scripts/ training/
      - name: pytest (deterministic core)
        run: python -m pytest tests/ -q
