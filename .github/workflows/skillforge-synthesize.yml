name: SKILLFORGE Synthesize (daily, distills skills from memory, opens PR)

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillforge-synthesize
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # for the WIF auth step below (agents/llm.py::ask_vertex_candidate())
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: vertex-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: Distill skills from real memory
        # No install step needed for the `groq` package anymore — this now
        # goes through agents.llm.ask()'s stdlib-only multi-provider chain
        # (see skillforge/synthesize.py) instead of a raw Groq SDK call, so
        # a Groq-only rate limit no longer silently skips the day's
        # distillation. All fallback keys passed through same as
        # deep-dive-bounty.yml; any that are unset are simply skipped.
        # synthesize.py tries OCI-hosted Grok 4.3 first (agents/llm.py::
        # ask_oci_grok()), falling back to VAPE's Vertex-tuned model
        # (VAPE_VERTEX_ACCESS_TOKEN, from the WIF auth step above), falling
        # back further to the chain below unchanged if both error/aren't
        # configured.
        run: python skillforge/synthesize.py
        env:
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      - name: Open PR with new/updated skills
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet skillforge/skills/ skillforge/memory/INDEX.md; then
            echo "no skill changes to propose"; exit 0
          fi
          BRANCH="skillforge/synthesize-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add skillforge/skills/ skillforge/memory/INDEX.md
          git commit -m "skillforge synthesize $(date -u +%F): distilled skills from real findings"
          # persist-credentials: false on checkout (see #157) means push has no
          # credential unless re-injected here, scoped to just this step.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$BRANCH"
          if gh pr create --title "SKILLFORGE skills update $(date -u +%F)" \
            --body "Auto-distilled from real findings/lessons by skillforge-synthesize. Review before merge." \
            --label "skillforge,skills" --base main --head "$BRANCH"; then
            # A fresh PR supersedes any earlier, still-open one — nobody was
            # closing those out, so #85 and #112 sat open simultaneously with
            # no way to tell which snapshot was current. Close the rest so
            # only the newest daily snapshot stays open for review.
            for old in $(gh pr list --state open --label skillforge --json number,headRefName \
                --jq ".[] | select(.headRefName != \"$BRANCH\" and (.headRefName | startswith(\"skillforge/synthesize-\"))) | .number"); do
              gh pr close "$old" --comment "Superseded by a newer SKILLFORGE synthesize PR." || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
