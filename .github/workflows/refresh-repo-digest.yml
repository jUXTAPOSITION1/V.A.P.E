name: Refresh Repo Digest (Vertex candidate grounding)

# Regenerates skillforge/memory/repo_digest.md — the real, deterministic
# repo-grounding doc VAPE's Vertex-tuned candidate reads on every call (see
# agents/llm.py::_call_vertex_tuned() -> _load_repo_digest()). Purely
# mechanical extraction (architecture docs verbatim + every module's own
# real docstring + a real directory tree, scripts/build_repo_digest.py) —
# no LLM involved in generating it, so it commits straight to main like any
# other deterministic derived-data refresh (see refresh-training-corpus.yml),
# not through a PR.
#
# Weekly is plenty — the repo's actual architecture/module structure changes
# far slower than its daily data commits (intel/reports/, intel/investigations/,
# skillforge/memory/*.jsonl), none of which this digest even reads.
on:
  schedule:
    - cron: '0 5 * * 0'   # weekly, Sunday 05:00 UTC (offset from refresh-training-corpus's Monday slot)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-repo-digest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only this job needs it (the final Commit step) — scoped here, not workflow-wide
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Rebuild the repo digest
        run: python scripts/build_repo_digest.py

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillforge/memory/repo_digest.md
          git commit -m "repo digest: refresh $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
