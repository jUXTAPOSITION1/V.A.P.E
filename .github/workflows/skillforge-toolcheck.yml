name: SKILLFORGE Toolcheck (6x/day, installs + smoke-tests every registered security tool)

on:
  schedule:
    - cron: '37 */4 * * *'   # every 4h at :37
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillforge-toolcheck
  cancel-in-progress: false

jobs:
  toolcheck:
    runs-on: ubuntu-latest
    # Scoped here (not at workflow level) per zizmor's least-privilege check —
    # id-token: write is only needed by this job's WIF auth step
    # (agents/llm.py::ask_vertex_candidate()); contents/issues: write are for
    # the commit + broken-tools-issue steps below.
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Cache tool installs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cyfrin
            ~/.cargo
            ~/.foundry
            ~/.local
            ~/.cache/pip
          key: skillforge-tools-${{ hashFiles('skillforge/memory/tools-registry.json') }}
          restore-keys: skillforge-tools-
      - id: vertex-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: Verify + version-pin registered tools
        # Real, confirmed gap this closes: skillforge/toolcheck.py's own
        # Analyst Briefing goes through agents/intel_common.py::grok_analysis()
        # (OCI Grok 4.3 primary, falling back to this Vertex-tuned model, then
        # the free FRONTIER_ORDER chain) — but this workflow never gave it
        # OCI_GENAI_API_KEY or VAPE_VERTEX_ACCESS_TOKEN, so every run skipped
        # straight to the free chain regardless of what grok_analysis() was
        # actually designed to try first.
        run: python skillforge/toolcheck.py
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          VAPE_TRACE_ALCHEMY_API: ${{ secrets.VAPE_TRACE_ALCHEMY_API }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      - name: Commit registry updates (direct, data only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillforge/memory/ intel/reports/
          git commit -m "skillforge toolcheck $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            if git push; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push after 5 retries -- changes were NOT committed"
            exit 1
          fi
      - name: Open issue on broken tools
        if: always()
        run: |
          if [ -f /tmp/broken_tools.txt ] && [ -s /tmp/broken_tools.txt ]; then
            gh issue create --title "SKILLFORGE: tool breakage $(date -u +%F)" \
              --body "$(cat /tmp/broken_tools.txt)" --label "skillforge,tooling" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
