name: SKILLFORGE Toolcheck (6x/day, installs + smoke-tests every registered security tool)

on:
  schedule:
    - cron: '37 */4 * * *'   # every 4h at :37
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: skillforge-toolcheck
  cancel-in-progress: false

jobs:
  toolcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Cache tool installs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cyfrin
            ~/.cargo
            ~/.foundry
            ~/.local
            ~/.cache/pip
          key: skillforge-tools-${{ hashFiles('skillforge/memory/tools-registry.json') }}
          restore-keys: skillforge-tools-
      - name: Verify + version-pin registered tools
        run: python skillforge/toolcheck.py
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          VAPE_TRACE_ALCHEMY_API: ${{ secrets.VAPE_TRACE_ALCHEMY_API }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      - name: Commit registry updates (direct, data only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillforge/memory/ intel/reports/
          git commit -m "skillforge toolcheck $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
      - name: Open issue on broken tools
        if: always()
        run: |
          if [ -f /tmp/broken_tools.txt ] && [ -s /tmp/broken_tools.txt ]; then
            gh issue create --title "SKILLFORGE: tool breakage $(date -u +%F)" \
              --body "$(cat /tmp/broken_tools.txt)" --label "skillforge,tooling" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
