name: VAPE Reviewer (automated security-forward PR review)

# In-house PR reviewer, alongside CodeRabbit (which stays as-is — this
# doesn't replace it, it fills the gap of a reviewer that actually knows
# this repo's own security laws, see docs/SECURITY_PROTOCOL.md). Advisory
# only, never a merge gate — see agents/code_review.py's module docstring.
#
# Deliberately `pull_request`, never `pull_request_target`: this job never
# checks out the PR's own branch, only this repo's base-branch copy of
# agents/code_review.py/scripts/code_lint.py. Every read of the PR's actual
# content (diff, changed-file text) happens over the GitHub API
# (skillforge/mcp.py's GitHubMCPWrapper) — text only, never a local
# checkout or execution of fork/branch-controlled code. Same "never run
# untrusted code with real secrets" property scripts/security_lint.py
# itself enforces on every other workflow here.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Minimal top-level baseline (satisfies scripts/security_lint.py's "declare
# permissions explicitly, don't rely on the default token scope" check) —
# `pull-requests: write` / `contents: write` are granted at the job level
# below instead of here, each scoped to the one job that actually needs it
# (zizmor excessive-permissions: a workflow-level grant applies to every
# job, including any added later, wider than this workflow actually needs).
permissions:
  contents: read

concurrency:
  group: vape-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_ANY_LLM_KEY: >-
        ${{ secrets.XAI_API_KEY_1 != '' || secrets.GROQ_API_KEY != '' ||
            secrets.GEMINI_API_KEY != '' || secrets.CEREBRAS_API_KEY != '' ||
            secrets.OPENROUTER_API_KEY != '' || secrets.GITHUB_MODELS_TOKEN != '' ||
            secrets.TOGETHER_API_KEY != '' || secrets.OCI_GENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Review PR
        if: ${{ env.HAS_ANY_LLM_KEY == 'true' }}
        run: python3 -m agents.code_review --pr "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}

      - name: Skip review (no LLM secrets configured yet)
        if: ${{ env.HAS_ANY_LLM_KEY == 'false' }}
        run: echo "No LLM provider key set — VAPE Reviewer needs at least one (see .env.example). Skipping."

  persist-findings:
    # Closes the real gap where scripts/code_lint.py's findings were only
    # ever posted as an advisory comment on the `review` job above and then
    # lost the moment the PR closed. Only runs once the PR actually merged
    # (never on a closed-without-merging PR) and re-lints the merged tree at
    # the real merge commit, so only what actually shipped gets logged — see
    # agents/code_review.py::persist_merged_findings.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Persist surviving HIGH/CRITICAL code_lint findings
        run: python3 -m agents.code_review --pr "$PR_NUMBER" --merge-sha "$MERGE_SHA"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          scripts/ci_commit_push.sh \
            "code_review: persist merged-PR findings (PR #$PR_NUMBER)" \
            skillforge/memory/findings.jsonl
