name: VAPE + HACK Bounty Cycle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install python-dotenv
      - name: Run
        run: python agents/run.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VAPE_PRIVATE_KEY: ${{ secrets.VAPE_PRIVATE_KEY }}
          HACK_PRIVATE_KEY: ${{ secrets.HACK_PRIVATE_KEY }}
