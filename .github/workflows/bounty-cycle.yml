name: VAPE + HACK Bounty + Self-Improvement Cycle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounty-hunt:
    runs-on: ubuntu-latest
    # Scoped here (not at workflow level) per zizmor's least-privilege check —
    # id-token: write is only needed by this job's own WIF auth step
    # (agents/llm.py::ask_vertex_candidate()); contents: write is for the
    # commit step below.
    permissions:
      contents: write
      id-token: write
    env:                              # ← ADDED: job-level env for all MCP/research keys
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (skillforge/research.py spawns Tavily/Firecrawl/Bright Data MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: |
          pip install -r agents/requirements.txt
          pip install slither-analyzer
      - id: vertex-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: Run Bounty Cycle
        # Real, confirmed gap this closes: agents/run.py's bounty_report
        # generation goes through agents.llm.ask_oci_grok() (OCI Grok 4.3
        # primary, falling back to this Vertex-tuned model, then the free
        # FRONTIER_ORDER chain) — but this workflow never gave it
        # OCI_GENAI_API_KEY or VAPE_VERTEX_ACCESS_TOKEN, so every run
        # skipped straight to the free chain, which was frequently
        # exhausted/broken, producing the "did not start with the required
        # SIGNAL: marker" fallback on every recent cycle.
        run: python agents/run.py
        env:
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      # The auto-target deep investigation moved to its own workflow
      # (featured-investigation.yml, every 30 min) so the site's Featured
      # Investigation spotlight + DATA AGENT get a fresher cadence than the
      # rest of this hourly cycle without bumping everything else's cost.
      - name: Build Intel Index (site data)
        run: python agents/build_intel_index.py
      - name: Rebuild Memory SQLite index (queryable recall; derived, not committed)
        run: python -m skillforge.memory.index_db build || echo "memory index skipped"
      - name: Commit Reports
        # run.py appends grounded findings to Memory; investigate.py writes
        # investigations + catalog + findings; build_intel_index.py refreshes
        # data/intel-index.json for the dashboard. Stage all so the tree is clean.
        #
        # The inline retry loop this replaces failed the whole job on
        # 2026-07-26 even though the cycle itself succeeded: a concurrent run
        # had appended to skillforge/memory/llm_usage.jsonl and
        # anomaly_state.json, `git pull --rebase` conflicted, the rebase
        # stopped on a detached HEAD, and all five "retries" then pushed from
        # no branch at all. See scripts/ci_commit_push.sh for the full story.
        run: |
          scripts/ci_commit_push.sh \
            "Auto-generated bounty report $(date -u +%Y-%m-%dT%H:%MZ)" \
            reports/ skillforge/memory/ intel/ data/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-review:
    runs-on: ubuntu-latest
    # Scoped here (not at workflow level) — see bounty-hunt job's own comment.
    permissions:
      contents: write
      id-token: write
    env:                              # ← ADDED: job-level env for all MCP/research keys
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Install
        run: pip install -r agents/requirements.txt
      - id: vertex-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'
      - name: VAPE Repo Review
        # Same OCI Grok/Vertex-tuned-candidate wiring as the bounty-hunt job
        # above — --review-repo goes through the exact same main()/ask_llm()
        # pipeline in agents/run.py.
        run: python agents/run.py --review-repo
        env:
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      - name: Commit Review
        # Same shared helper as the bounty-hunt job above. This job runs
        # concurrently with it and writes the same skillforge/memory/ ledgers,
        # so it is one of the two racers that produced the conflict in the
        # first place — it needs the identical merge policy, not a copy of the
        # loop that could drift.
        run: |
          scripts/ci_commit_push.sh \
            "VAPE repo review $(date -u +%Y-%m-%dT%H:%MZ)" \
            reports/ skillforge/memory/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
