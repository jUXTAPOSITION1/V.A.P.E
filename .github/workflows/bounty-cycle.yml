name: VAPE + HACK Bounty + Self-Improvement Cycle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounty-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Install
        run: |
          pip install -r agents/requirements.txt
          pip install slither-analyzer
      - name: Run Bounty Cycle
        run: python agents/run.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit Reports
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # run.py now also appends grounded findings to Memory; stage both so
          # the rebase has a clean tree (findings.jsonl is tracked).
          git add reports/ skillforge/memory/ || true
          git commit -m "Auto-generated bounty report $(date)" || { echo "No new reports"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Install
        run: pip install -r agents/requirements.txt
      - name: VAPE Repo Review
        run: python agents/run.py --review-repo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit Review
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ skillforge/memory/ || true
          git commit -m "VAPE repo review $(date)" || { echo "No new reviews"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
