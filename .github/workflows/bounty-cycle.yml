name: VAPE + HACK Autonomous Bounty Cycle

on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  workflow_dispatch:  # Manual trigger

jobs:
  bounty-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r agents/requirements.txt
      
      - name: Run Autonomous Cycle
        run: python agents/main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VAPE_PRIVATE_KEY: ${{ secrets.VAPE_PRIVATE_KEY }}
          HACK_PRIVATE_KEY: ${{ secrets.HACK_PRIVATE_KEY }}
      
      - name: Commit Reports
        run: |
          git config user.name "VAPE Agent"
          git config user.email "agent@basedvape.com"
          git add reports/
          git commit -m "Auto report from bounty cycle $(date)" || echo "No changes"
          git push
