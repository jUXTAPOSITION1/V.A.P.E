name: External Bounty Engagement Audit

# VAPE's reusable pipeline (agents/external_audit.py) for auditing a real
# external bug-bounty target repo — built for the first real engagement,
# Momentum's mmt-v3-core CLMM (Move/Sui):
# https://hackenproof.com/programs/momentum-smart-contracts
# real program repo mirror: github.com/hackenproof-public/mmt-v3-core
# (source verified identical at the canonical github.com/mmt-finance/v3-core)
#
# Fired two ways, same as deep-dive-bounty.yml:
#   - Manual workflow_dispatch for a deliberate, scoped engagement per program
#     (not a scheduled sweep — that's agents/hack_sweep.py's job, for VAPE's
#     own Base/EVM targets).
#   - x402: worker/src/lib/githubDispatch.ts's dispatchExternalBountyAudit()
#     calls this via the REST API after a buyer's payment settles on
#     /scan/bounty_deep_dive with an owner/repo instead of an address (the
#     "hire VAPE for this specific bounty program" flow).
#
# No engagement-specific defaults here deliberately: the first real engagement
# (Momentum's mmt-v3-core CLMM, https://hackenproof.com/programs/momentum-smart-contracts)
# used to be hardcoded as the default for every field, including `paths` —
# that's a real bug for any other program, since GitHub Actions falls back to
# a workflow_dispatch input's `default:` whenever a caller supplies an empty
# value (not just when the key is omitted), silently poisoning any dispatch
# for a different repo with Momentum's own file list and 404ing every fetch.
# `owner`/`repo` are always supplied by both a manual dispatch and the
# worker's automated call, so they need no default; `paths` empty means
# auto-discovery (the sane default behavior for a program nobody has
# pre-mapped file paths for yet).
on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub owner of the target repo'
        required: true
      repo:
        description: 'GitHub repo name'
        required: true
      ref:
        description: 'Git ref (branch/tag/commit) to audit'
        required: false
        default: 'main'
      program_name:
        description: 'Bounty program name (for the report header)'
        required: false
      paths:
        description: 'Comma-separated explicit file paths (skips auto-discovery — needed if the runner cannot reach api.github.com for this repo)'
        required: false
      callback_url:
        description: 'Optional webhook to POST the completed report to (x402 async path)'
        required: false
      engagement:
        description: 'paid (default, real x402/ACP job) | validation (manual pipeline check, no payment claimed)'
        required: false
        default: 'paid'

permissions:
  contents: read

concurrency:
  group: external-bounty-audit-${{ github.event.inputs.owner }}-${{ github.event.inputs.repo }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scoped here (not at workflow level) per zizmor's least-privilege check —
    # id-token: write is only needed by this job's own WIF auth step below
    # (agents/llm.py::ask_vertex_candidate()); contents: write is for the
    # commit step at the end.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - id: vertex-auth
        # Real, confirmed gap this closes — see deep-dive-bounty.yml's
        # matching comment: agents/external_audit.py's real audit call also
        # goes OCI Grok -> this Vertex-tuned model -> the free FRONTIER_ORDER
        # chain, but this workflow never had the WIF step wired in, leaving
        # this paid offering's repo-target path with no Vertex safety net.
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/87858016172/locations/global/workloadIdentityPools/github-actions-pool/providers/vape'
          service_account: 'vape-caller@project-ad5c5b86-3088-4903-97e.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Run the external bounty engagement audit
        # SECURITY: never interpolate github.event.inputs.* directly into a `run:`
        # string — callback_url in particular is attacker-influenced (an x402
        # buyer's own query param, unvalidated by the worker). Routing everything
        # through `env:` first means bash sees it only as a quoted variable
        # expansion, never as re-parsed shell syntax (same pattern deep-dive-bounty.yml
        # already uses for its own callback_url input).
        env:
          TARGET_OWNER: ${{ github.event.inputs.owner }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
          TARGET_REF: ${{ github.event.inputs.ref }}
          TARGET_PROGRAM: ${{ github.event.inputs.program_name }}
          TARGET_PATHS: ${{ github.event.inputs.paths }}
          TARGET_CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          TARGET_ENGAGEMENT: ${{ github.event.inputs.engagement }}
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VAPE_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-auth.outputs.access_token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          ARGS=(--owner "$TARGET_OWNER" --repo "$TARGET_REPO" --ref "$TARGET_REF")
          if [ -n "$TARGET_PROGRAM" ]; then
            ARGS+=(--program-name "$TARGET_PROGRAM")
          fi
          if [ -n "$TARGET_PATHS" ]; then
            ARGS+=(--paths "$TARGET_PATHS")
          fi
          if [ -n "$TARGET_CALLBACK_URL" ]; then
            ARGS+=(--callback-url "$TARGET_CALLBACK_URL")
          fi
          if [ -n "$TARGET_ENGAGEMENT" ]; then
            ARGS+=(--engagement "$TARGET_ENGAGEMENT")
          fi
          python -m agents.external_audit "${ARGS[@]}"

      - name: Commit the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OWNER: ${{ github.event.inputs.owner }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
          TARGET_ENGAGEMENT: ${{ github.event.inputs.engagement }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # See deep-dive-bounty.yml's matching comment: a real paid buyer's
          # PoC must never be committed to this PUBLIC repo — they already
          # get it privately via callback_url (x402) or `acp provider submit`
          # (ACP, which bypasses this workflow entirely). Only a "validation"
          # dispatch (no real buyer, non-sensitive) gets committed publicly;
          # "paid" is also the safe default when this input is left unset.
          if [ "$TARGET_ENGAGEMENT" != "validation" ]; then
            echo "paid engagement — report already delivered privately; skipping public commit"
            git add skillforge/memory/ || true
          else
            git add intel/audits/external-bounties/ skillforge/memory/ || true
          fi
          git commit -m "External bounty audit: $TARGET_OWNER/$TARGET_REPO" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # See deep-dive-bounty.yml's matching comment: the old loop's last
          # command on total failure was always `sleep` (always exits 0), so
          # every push attempt failing still reported this step as
          # successful, silently dropping the report. Also mirrors its two
          # other confirmed fixes: rebase onto $GITHUB_REF_NAME (not a
          # hardcoded "main" — wrong for any non-main dispatch, given this
          # job's shallow fetch-depth:1 checkout), and push with an explicit
          # ref so it works even when actions/checkout leaves HEAD detached.
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push the audit report after 5 retries — report was NOT committed"
            exit 1
          fi
