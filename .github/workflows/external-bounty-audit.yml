name: External Bounty Engagement Audit

# VAPE's reusable pipeline (agents/external_audit.py) for auditing a real
# external bug-bounty target repo — built for the first real engagement,
# Momentum's mmt-v3-core CLMM (Move/Sui):
# https://hackenproof.com/programs/momentum-smart-contracts
# real program repo mirror: github.com/hackenproof-public/mmt-v3-core
# (source verified identical at the canonical github.com/mmt-finance/v3-core)
#
# Fired two ways, same as deep-dive-bounty.yml:
#   - Manual workflow_dispatch for a deliberate, scoped engagement per program
#     (not a scheduled sweep — that's agents/hack_sweep.py's job, for VAPE's
#     own Base/EVM targets).
#   - x402: worker/src/lib/githubDispatch.ts's dispatchExternalBountyAudit()
#     calls this via the REST API after a buyer's payment settles on
#     /scan/bounty_deep_dive with an owner/repo instead of an address (the
#     "hire VAPE for this specific bounty program" flow).
#
# No engagement-specific defaults here deliberately: the first real engagement
# (Momentum's mmt-v3-core CLMM, https://hackenproof.com/programs/momentum-smart-contracts)
# used to be hardcoded as the default for every field, including `paths` —
# that's a real bug for any other program, since GitHub Actions falls back to
# a workflow_dispatch input's `default:` whenever a caller supplies an empty
# value (not just when the key is omitted), silently poisoning any dispatch
# for a different repo with Momentum's own file list and 404ing every fetch.
# `owner`/`repo` are always supplied by both a manual dispatch and the
# worker's automated call, so they need no default; `paths` empty means
# auto-discovery (the sane default behavior for a program nobody has
# pre-mapped file paths for yet).
on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub owner of the target repo'
        required: true
      repo:
        description: 'GitHub repo name'
        required: true
      ref:
        description: 'Git ref (branch/tag/commit) to audit'
        required: false
        default: 'main'
      program_name:
        description: 'Bounty program name (for the report header)'
        required: false
      paths:
        description: 'Comma-separated explicit file paths (skips auto-discovery — needed if the runner cannot reach api.github.com for this repo)'
        required: false
      callback_url:
        description: 'Optional webhook to POST the completed report to (x402 async path)'
        required: false

permissions:
  contents: read

concurrency:
  group: external-bounty-audit-${{ github.event.inputs.owner }}-${{ github.event.inputs.repo }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Run the external bounty engagement audit
        # SECURITY: never interpolate github.event.inputs.* directly into a `run:`
        # string — callback_url in particular is attacker-influenced (an x402
        # buyer's own query param, unvalidated by the worker). Routing everything
        # through `env:` first means bash sees it only as a quoted variable
        # expansion, never as re-parsed shell syntax (same pattern deep-dive-bounty.yml
        # already uses for its own callback_url input).
        env:
          TARGET_OWNER: ${{ github.event.inputs.owner }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
          TARGET_REF: ${{ github.event.inputs.ref }}
          TARGET_PROGRAM: ${{ github.event.inputs.program_name }}
          TARGET_PATHS: ${{ github.event.inputs.paths }}
          TARGET_CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          OCI_GENAI_API_KEY: ${{ secrets.OCI_GENAI_API_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          ARGS=(--owner "$TARGET_OWNER" --repo "$TARGET_REPO" --ref "$TARGET_REF")
          if [ -n "$TARGET_PROGRAM" ]; then
            ARGS+=(--program-name "$TARGET_PROGRAM")
          fi
          if [ -n "$TARGET_PATHS" ]; then
            ARGS+=(--paths "$TARGET_PATHS")
          fi
          if [ -n "$TARGET_CALLBACK_URL" ]; then
            ARGS+=(--callback-url "$TARGET_CALLBACK_URL")
          fi
          python -m agents.external_audit "${ARGS[@]}"

      - name: Commit the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OWNER: ${{ github.event.inputs.owner }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/audits/external-bounties/ skillforge/memory/ || true
          git commit -m "External bounty audit: $TARGET_OWNER/$TARGET_REPO" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
