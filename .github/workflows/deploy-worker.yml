name: Deploy x402 Worker (Cloudflare)

# Primary deploy target. worker/deno/ mirrors the same app on Deno Deploy
# (its own GitHub integration handles that one, no workflow needed) as a
# documented fallback if this account ever hits Cloudflare's workers.dev
# subdomain-registration issue again — see worker/README.md.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Actions doesn't allow referencing `secrets` directly inside an
    # `if:` conditional (rejected as an invalid workflow file, before any job
    # runs) — route it through `env:` first, per GitHub's documented pattern.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_JOBS_KV: ${{ secrets.VAPE_JOBS_KV_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      # The live x402 job ledger's KV binding can't be committed as a static
      # wrangler.toml block (a placeholder id would fail `wrangler deploy`
      # outright — see wrangler.toml's VAPE_JOBS comment) so it's appended
      # here, only once VAPE_JOBS_KV_ID exists as a repo secret. Skipped
      # entirely otherwise — /scan/* deploys and works exactly the same
      # either way, /x402/feed just stays unconfigured until this is set.
      - name: Wire VAPE_JOBS KV binding (if configured)
        if: ${{ env.HAS_JOBS_KV == 'true' }}
        working-directory: worker
        run: |
          cat >> wrangler.toml <<EOF

          [[kv_namespaces]]
          binding = "VAPE_JOBS"
          id = "${{ secrets.VAPE_JOBS_KV_ID }}"
          EOF

      - name: Deploy
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        # Pinned to the v4 tag's current commit, not the mutable tag itself —
        # this step runs with live CLOUDFLARE_API_TOKEN/ACCOUNT_ID on every
        # push to main touching worker/**, so a repointed tag on the upstream
        # action would otherwise be an unreviewed way to run arbitrary code
        # with real deploy credentials. Re-pin deliberately (verify the new
        # commit on cloudflare/wrangler-action first) when bumping this.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          # Must match worker/package.json's own "wrangler" devDependency
          # version exactly. When they drift, this action tries to
          # force-install ITS pinned version fresh via npm rather than reuse
          # the one `npm ci` already installed — and that fresh install's
          # peer-dependency resolution can conflict with whatever
          # @cloudflare/workers-types version package.json has, failing the
          # whole deploy with an ERESOLVE error before wrangler ever runs.
          wranglerVersion: '4.111.0'

      - name: Skip deploy (no Cloudflare secrets yet)
        if: ${{ env.HAS_CF_TOKEN == 'false' }}
        run: echo "CLOUDFLARE_API_TOKEN not set — typecheck passed, skipping live deploy. See worker/README.md."

      # Runs on GitHub's runner, which has real unrestricted egress — proves
      # the deploy actually answers requests, not just that `wrangler deploy`
      # exited 0 (uploading successfully and being reachable are different
      # things, e.g. the workers.dev subdomain not being claimed yet). Custom
      # `if:` conditions replace the implicit success() check rather than
      # adding to it, so success() is spelled out here on purpose.
      - name: Smoke test (confirm the live deploy actually answers)
        if: ${{ success() && env.HAS_CF_TOKEN == 'true' }}
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 2 https://vape-x402.vapex402.workers.dev/)
          echo "$body"
          echo "$body" | grep -q '"agent":"VAPE"' || { echo "::error::Smoke test failed — https://vape-x402.vapex402.workers.dev/ did not return the expected VAPE/x402 payload"; exit 1; }

      # Names only, never values — safe to print to the Actions log. Manual
      # trigger only (not on every push) since this is an audit convenience,
      # not something that needs to run on every deploy.
      - name: List configured Worker secrets (names only, manual trigger only)
        if: ${{ success() && env.HAS_CF_TOKEN == 'true' && github.event_name == 'workflow_dispatch' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: secret list
          wranglerVersion: '4.111.0'

      # Spot-checks the free (no x402 gate) Alchemy/CoinGecko-backed routes
      # against a real, known address (VAPE's own ACP wallet) so an
      # ALCHEMY_API_KEY/COINGECKO_API_KEY addition can be confirmed live
      # without needing a funded wallet to pay for the x402 routes. Logs
      # response snippets only — informational, never fails the job.
      - name: Spot-check free data routes (manual trigger only)
        if: ${{ success() && env.HAS_CF_TOKEN == 'true' && github.event_name == 'workflow_dispatch' }}
        run: |
          # No -f: curl's -f swallows the response BODY on HTTP error status
          # codes, which hid every route's JSON error/detail field behind a
          # bare "curl: (22) ... 502" on the very run meant to reveal it.
          addr=0xa1420293a7df49bc8380f543a1fe7b8d6f582879
          for path in "network-status" "portfolio?address=$addr" "nfts?address=$addr" "x402/feed?limit=20" "x402/stats?days=30"; do
            echo "--- /$path ---"
            curl -sS -w '\n(HTTP %{http_code})\n' --retry 2 --retry-delay 2 "https://vape-x402.vapex402.workers.dev/$path"
          done
          echo "--- VAPOR /stats (the other half of the 50/50 hybrid split) ---"
          curl -sS -w '\n(HTTP %{http_code})\n' --retry 2 --retry-delay 2 "https://x402.duckdns.org/stats"
          echo "--- VAPOR /supported (same call getSupported() makes) ---"
          curl -sS -w '\n(HTTP %{http_code})\n' --retry 2 --retry-delay 2 "https://x402.duckdns.org/supported"
          echo "--- VAPOR /verify with a deliberately-invalid payload (expect a clean 400, not a timeout/connection failure) ---"
          curl -sS -w '\n(HTTP %{http_code})\n' --retry 2 --retry-delay 2 -X POST "https://x402.duckdns.org/verify" \
            -H "Content-Type: application/json" -d '{"x402Version":1,"paymentPayload":{},"paymentRequirements":{}}'

      - name: If Deploy or the smoke test failed, check the workers.dev subdomain first
        if: ${{ failure() }}
        run: |
          echo "::error::Deploy or the post-deploy smoke test failed. If the Deploy step's log shows 'You need to register a workers.dev subdomain', this is an account-level Cloudflare setup step, not a code issue: Workers & Pages -> Overview in the dashboard, claim a subdomain, confirm it shows an active value (not blank/-null), then re-run this workflow. If Deploy succeeded but the smoke test failed, the Worker uploaded but isn't answering at the expected URL — check that vape-x402.vapex402.workers.dev still matches this account's actual claimed subdomain. See worker/README.md's 'Cloudflare + Deno Deploy' section."
