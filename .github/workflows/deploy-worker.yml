name: Deploy x402 Worker (Cloudflare)

# Primary deploy target. worker/deno/ mirrors the same app on Deno Deploy
# (its own GitHub integration handles that one, no workflow needed) as a
# documented fallback if this account ever hits Cloudflare's workers.dev
# subdomain-registration issue again — see worker/README.md.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Actions doesn't allow referencing `secrets` directly inside an
    # `if:` conditional (rejected as an invalid workflow file, before any job
    # runs) — route it through `env:` first, per GitHub's documented pattern.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Deploy
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          wranglerVersion: '4.107.0'

      - name: Skip deploy (no Cloudflare secrets yet)
        if: ${{ env.HAS_CF_TOKEN == 'false' }}
        run: echo "CLOUDFLARE_API_TOKEN not set — typecheck passed, skipping live deploy. See worker/README.md."

      - name: If Deploy failed, check the workers.dev subdomain first
        if: ${{ failure() }}
        run: |
          echo "::error::Deploy failed. If the log above shows 'You need to register a workers.dev subdomain', this is an account-level Cloudflare setup step, not a code issue: Workers & Pages -> Overview in the dashboard, claim a subdomain, confirm it shows an active value (not blank/-null), then re-run this workflow. See worker/README.md's 'Cloudflare + Deno Deploy' section."
