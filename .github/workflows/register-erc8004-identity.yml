name: Register ERC-8004 Agent Identity (one-off, manual)

on:
  # Deliberately manual-only, no schedule: this is a one-time identity mint,
  # not a recurring job. See scripts/register_erc8004_identity.py for why
  # this calls the canonical IdentityRegistry contract directly instead of
  # driving Chitin's web UI.
  workflow_dispatch:

permissions:
  contents: read

# Serializes overlapping manual dispatches so the balanceOf() idempotency
# guard in register_erc8004_identity.py can't be raced: two runs started
# close together would otherwise both observe balance==0 before either
# register() call confirms, and both mint a separate agentId.
concurrency:
  group: register-erc8004-identity
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pip install -r agents/requirements.txt
      - run: python3 scripts/register_erc8004_identity.py
