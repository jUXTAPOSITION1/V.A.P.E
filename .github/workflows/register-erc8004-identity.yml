name: Register ERC-8004 Agent Identity (one-off, manual)

on:
  # Deliberately manual-only, no schedule: this is a one-time identity mint,
  # not a recurring job. See scripts/register_erc8004_identity.py for why
  # this calls the canonical IdentityRegistry contract directly instead of
  # driving Chitin's web UI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r agents/requirements.txt
      - run: python3 scripts/register_erc8004_identity.py
