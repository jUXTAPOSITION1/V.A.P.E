name: CDP Bazaar Indexing Self-Check (weekly)

on:
  schedule:
    - cron: '0 13 * * 1'   # weekly, Monday — this changes slowly if at all
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdp-bazaar-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check whether VAPE's offerings are actually indexed in CDP's Bazaar catalog
        run: python agents/cdp_bazaar_check.py
      - name: Commit state + findings if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillforge/memory/cdp_bazaar_check_state.json skillforge/memory/findings.jsonl || true
          git commit -m "CDP Bazaar indexing check $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            if git push; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push after 5 retries -- changes were NOT committed"
            exit 1
          fi
