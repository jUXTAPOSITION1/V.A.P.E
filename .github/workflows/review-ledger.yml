name: VAPE Ledger Self-Review (pass/caution weekly, fail monthly)

# VAPE checking its own past verdicts against fresh data — "where was I
# accurate, where wasn't I." Re-checks the oldest-reviewed addresses in each
# category (never the same handful every time) via the real
# agents/investigate.py pipeline, and logs a real finding whenever a past
# verdict no longer holds. Pass/caution reviewed weekly (more likely to
# drift — a clean or borderline token can still turn bad); fail reviewed
# monthly (a REJECT rarely needs urgent re-checking).
on:
  schedule:
    - cron: '0 9 * * 1'    # Mondays 09:00 UTC — pass + caution
    - cron: '0 9 1 * *'    # 1st of the month 09:00 UTC — fail
  workflow_dispatch:
    inputs:
      categories:
        description: 'Comma list: pass,caution,fail'
        default: 'pass,caution'
      sample:
        description: 'Max addresses re-checked per category'
        default: '5'

permissions:
  contents: write

concurrency:
  group: review-ledger
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      DATA_AGENT_PRIVATE_KEY: ${{ secrets.DATA_AGENT_PRIVATE_KEY }}
      # agents/investigate.py's Grok expert assessment (agents/llm.py's
      # FRONTIER_ORDER) runs on every real re-check below — was previously
      # unwired here entirely, so it silently no-op'd on every run.
      XAI_API_KEY_1: ${{ secrets.XAI_API_KEY_1 }}
      XAI_API_KEY_2: ${{ secrets.XAI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      - name: Cache npm (agents/investigate.py's web reputation check spawns research MCP servers via npx)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-research-mcp-${{ runner.os }}
      - name: Install
        run: pip install -r agents/requirements.txt
      - name: Determine categories for this trigger
        id: cats
        run: |
          if [ -n "${{ github.event.inputs.categories }}" ]; then
            echo "categories=${{ github.event.inputs.categories }}" >> "$GITHUB_OUTPUT"
            echo "sample=${{ github.event.inputs.sample }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 1 * *" ]; then
            echo "categories=fail" >> "$GITHUB_OUTPUT"
            echo "sample=5" >> "$GITHUB_OUTPUT"
          else
            echo "categories=pass,caution" >> "$GITHUB_OUTPUT"
            echo "sample=5" >> "$GITHUB_OUTPUT"
          fi
      - name: Run self-review
        run: python agents/review_ledger.py --categories "${{ steps.cats.outputs.categories }}" --sample "${{ steps.cats.outputs.sample }}"
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      - name: Commit ledger + lists + review report
        run: |
          git config user.name "VAPE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/investigations/ skillforge/memory/ || true
          git commit -m "VAPE ledger self-review $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break || { echo "push race retry $i"; sleep $((i*3)); }
          done
