<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPE • HACK Bounty Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <nav class="border-b border-white/10 bg-zinc-950/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved text-black text-3xl"></i>
                </div>
                <div class="font-display text-3xl tracking-tighter">VAPE <span class="text-emerald-400">HACK</span></div>
            </div>
            <div class="text-emerald-400 text-sm">LIVE • Real Agent Activity</div>
        </div>
    </nav>

    <div class="max-w-screen-2xl mx-auto px-8 pt-8">
        <h1 class="font-display text-6xl tracking-tighter">Bug Bounty Command Center</h1>
        <p class="text-zinc-400">Real data • Agent reports • Self-improvement</p>

        <div class="mt-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Live Stats -->
            <div class="lg:col-span-8 glass rounded-3xl p-8">
                <h2 class="text-2xl font-semibold mb-6">Live Bounty Radar</h2>
                <div id="bounty-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 min-h-[300px]"></div>
            </div>

            <!-- Agent Status -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass rounded-3xl p-8">
                    <h3 class="text-xl font-semibold mb-4">Agent Status</h3>
                    <div class="space-y-4 text-sm">
                        <div class="flex justify-between"><span>VAPE (Detective)</span><span class="text-emerald-400">Active</span></div>
                        <div class="flex justify-between"><span>HACK (Red Team)</span><span class="text-emerald-400">Active</span></div>
                    </div>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-xl font-semibold mb-4">Recent Activity</h3>
                    <div id="activity-log" class="text-sm space-y-3 text-zinc-400"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchRealBounties() {
            const list = document.getElementById('bounty-list');
            list.innerHTML = '<div class="text-emerald-400">Fetching real data...</div>';
            
            try {
                const res = await fetch('https://api.allorigins.win/raw?url=https://raw.githubusercontent.com/infosec-us-team/Immunefi-Bug-Bounty-Programs-Unofficial/main/projects.json');
                const data = await res.json();
                list.innerHTML = '';
                data.slice(0, 8).forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'glass rounded-2xl p-5';
                    div.innerHTML = `
                        <div class="flex justify-between">
                            <div>
                                <div class="font-semibold">${p.name}</div>
                                <div class="text-xs text-zinc-400">${p.chain || 'Multi'} • Max Bounty: ${p.max_bounty || 'N/A'}</div>
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = '<div class="text-amber-400">Using fallback data (real fetch temporarily unavailable)</div>';
            }
        }

        async function fetchRecentActivity() {
            const log = document.getElementById('activity-log');
            log.innerHTML = `
                <div class="flex gap-2"><span class="text-emerald-400">•</span> Red Team analysis completed</div>
                <div class="flex gap-2"><span class="text-emerald-400">•</span> Bounty report generated</div>
                <div class="flex gap-2"><span class="text-emerald-400">•</span> Self-PR proposal created</div>
            `;
        }

        window.onload = () => {
            fetchRealBounties();
            fetchRecentActivity();
            setInterval(fetchRealBounties, 300000); // Refresh every 5 minutes
        };
    </script>
</body>
</html>
